include:
  - path: prefect.yaml
services:
  # PostgreSQL database
  mlflow_db:
    container_name: mlflow_db
    image: postgres:14
    restart: always
    environment:
      - POSTGRES_USER=${MLFLOW_DB_USER}
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD}
      - POSTGRES_DB=${MLFLOW_DB_DATABASE}
      - POSTGRES_PORT=${MLFLOW_DB_PORT}
    # networks:
    #   - backend
    ports:
      - "${MLFLOW_DB_PORT}:5432"
    volumes:
      - mlflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3
  # MinIO server for S3-compatible object storage
  s3:
    container_name: s3_minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    # networks:
    #   - frontend
    #   - backend
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - s3_minio_data:/data
    command: server /data --console-address ${MINIO_CONSOLE_ADDRESS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  # Create a bucket named "mlflow" on MinIO if it doesn't exist
  minio_create_bucket:
    container_name: minio_create_bucket
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    # networks:
    #   - backend
    entrypoint: >
      bash -c "
      mc alias set minio http://s3:9000 ${MINIO_ACCESS_KEY:-MINIO_ROOT_USER} ${MINIO_SECRET_ACCESS_KEY:-MINIO_ROOT_PASSWORD};
      if ! mc ls minio/${MLFLOW_BUCKET_NAME}; then
        echo 'Creating ${MLFLOW_BUCKET_NAME} bucket...';
        mc mb minio/${MLFLOW_BUCKET_NAME}
        mc policy download minio/${MLFLOW_BUCKET_NAME}
        echo '${MLFLOW_BUCKET_NAME} bucket created';
      else
        echo '${MLFLOW_BUCKET_NAME} bucket already exists'
      fi
      "
  # MLflow Tracking Server
  mlflow_tracking_server:
    container_name: mlflow_server
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      mlflow_db:
        condition: service_healthy
      s3:
        condition: service_healthy
      minio_create_bucket:
        condition: service_completed_successfully
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-$MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-$MINIO_ROOT_PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://s3:${MINIO_PORT} # Replace this with remote storage endpoint e.g. s3://my-bucket in real use cases
      - MLFLOW_S3_IGNORE_TLS=true
    # networks:
    #   - frontend
    #   - backend
    ports:
      - "${MLFLOW_PORT}:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@mlflow_db:5432/${MLFLOW_DB_DATABASE}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
  # Create a bucket named "mlflow" on MinIO if it doesn't exist
  evidently_create_bucket:
    container_name: evidently_create_bucket
    image: minio/mc
    depends_on:
      s3:
        condition: service_healthy
    # networks:
    #   - backend
    entrypoint: >
      bash -c "
      mc alias set minio http://s3:9000 ${MINIO_ACCESS_KEY:-MINIO_ROOT_USER} ${MINIO_SECRET_ACCESS_KEY:-MINIO_ROOT_PASSWORD};
      if ! mc ls minio/${EVIDENTLY_BUCKET_NAME}; then
        echo 'Creating ${EVIDENTLY_BUCKET_NAME} bucket...';
        mc mb minio/${EVIDENTLY_BUCKET_NAME}
        mc policy download minio/${EVIDENTLY_BUCKET_NAME}
        echo '${EVIDENTLY_BUCKET_NAME} bucket created';
      else
        echo '${EVIDENTLY_BUCKET_NAME} bucket already exists'
      fi
      "
  # Evidently service for data drift monitoring
  evidently:
    container_name: evidently_service
    build:
      context: .
      dockerfile: Dockerfile.evidently
    ports:
      - "8000:8000"
    depends_on:
      evidently_create_bucket:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
    restart: always
    environment:
      - FSSPEC_S3_ENDPOINT_URL=http://s3:9000
      - FSSPEC_S3_KEY=${MINIO_ACCESS_KEY:-MINIO_ROOT_USER} 
      - FSSPEC_S3_SECRET=${MINIO_SECRET_ACCESS_KEY:-MINIO_ROOT_PASSWORD} 
    command: --workspace s3://${EVIDENTLY_BUCKET_NAME}/workspace
    # networks:
    #   - backend
    #   - frontend
    volumes:
      - evidently_workspace:/app/workspace

volumes:
  mlflow_data:
  s3_minio_data:
  evidently_workspace:

